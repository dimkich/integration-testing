integration:
  testing:
    self-testing: true
    kafka:
      connections:
        kafka1:
          bootstrapServers: "${embedded.kafka.brokerList}"
          expected-groups:
            - text-record-group
          # The test application uses string keys, so the record-level base must not
          # change the key format (otherwise json/spring records would get json keys).
          serializer:
            key:
              type: string
          deserializer:
            key:
              type: string
          excluded-fields:
            - partition
            - offset
            - timestamp
            - headers.id
            - headers.timestamp
            - headers.kafka_batchConvertedHeaders
            - headers.kafka_offset
            - headers.kafka_receivedPartitionId
            - headers.kafka_receivedTimestamp
            - headers.kafka_timestampType
          topics:
            "text-record-in":
              serializer:
                type: string
            "text-record-out":
              deserializer:
                type: string

            "text-parts-in":
              serializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.StringSerializer
                value:
                  type: io.github.dimkich.integration.testing.serde.impl.StringSerializer
                headers:
                  type: io.github.dimkich.integration.testing.serde.impl.StringSerializer
            "text-parts-out":
              deserializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.StringDeserializer
                value:
                  type: io.github.dimkich.integration.testing.serde.impl.StringDeserializer
                headers:
                  type: io.github.dimkich.integration.testing.serde.impl.StringDeserializer

            "text-native-in":
              serializer:
                key:
                  type: org.apache.kafka.common.serialization.StringSerializer
                value:
                  type: org.apache.kafka.common.serialization.StringSerializer
                headers:
                  type: org.apache.kafka.common.serialization.StringSerializer
            "text-native-out":
              deserializer:
                key:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                headers:
                  type: org.apache.kafka.common.serialization.StringDeserializer

            "text-string-record-in":
              serializer:
                bean-ref: textStringSerializer
            "text-string-record-out":
              deserializer:
                bean-ref: textStringDeserializer

            "error-in":
              serializer:
                type: java.util.ArrayList

            # --- JSON SCENARIOS ---

            # KafkaRecord Serializer (type: json)
            "json-record-in":
              serializer:
                type: json
                headers:
                  type: string
            "json-record-out":
              deserializer:
                type: json
                target-class: io.github.dimkich.integration.testing.kafka.serde.json.JsonTestDto
                headers:
                  type: string

            # Individually Configured Parts (Key, Value, Headers separately)
            "json-parts-in":
              serializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.StringSerializer
                value:
                  type: json
                headers:
                  type: org.springframework.kafka.support.DefaultKafkaHeaderMapper
            "json-parts-out":
              deserializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.StringDeserializer
                value:
                  type: json
                  target-class: io.github.dimkich.integration.testing.kafka.serde.json.JsonTestDto
                headers:
                  type: org.springframework.kafka.support.DefaultKafkaHeaderMapper

            # Spring JSON (Spring Kafka native classes)
            "json-spring-json-in":
              serializer:
                type: spring-json
                add-type-info-headers: true
            "json-spring-json-out":
              deserializer:
                type: spring-json
                use-type-info-headers: true
                trusted-packages: "*"
            "json-spring-json-no-type-in":
              serializer:
                type: spring-json
                add-type-info-headers: false
            "json-spring-json-no-type-out":
              deserializer:
                type: spring-json
                use-type-info-headers: false
                target-class: io.github.dimkich.integration.testing.kafka.serde.json.JsonTestDto
                trusted-packages: "*"

            # --- BINARY SCENARIOS (BYTES) ---

            # Scenario 4: KafkaRecord Serializer (ByteArray)
            "byte-record-in":
              serializer:
                type: bytes
                headers:
                  type: string
            "byte-record-out":
              deserializer:
                type: bytes
                headers:
                  type: string

            # Scenario 5: Individually Configured Parts (Key, Value, Header)
            "byte-parts-in":
              serializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArraySerializer
                value:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArraySerializer
                headers:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArraySerializer
            "byte-parts-out":
              deserializer:
                key:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArrayDeserializer
                value:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArrayDeserializer
                headers:
                  type: io.github.dimkich.integration.testing.serde.impl.ByteArrayDeserializer

            # Scenario 6: Native Kafka SerDe Classes
            "byte-native-in":
              serializer:
                key:
                  type: org.apache.kafka.common.serialization.StringSerializer
                value:
                  type: org.apache.kafka.common.serialization.ByteArraySerializer
                headers:
                  type: org.apache.kafka.common.serialization.ByteArraySerializer
            "byte-native-out":
              deserializer:
                key:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                value:
                  type: org.apache.kafka.common.serialization.ByteArrayDeserializer
                headers:
                  type: org.apache.kafka.common.serialization.ByteArrayDeserializer

            # --- BINARY ENVELOPE ---

            # Native Kafka serializer + envelope: the framework encodes,
            # the SUT decodes it with its envelope deserializer.
            "bin-envelope-in":
              serializer:
                key:
                  type: org.apache.kafka.common.serialization.StringSerializer
                value:
                  type: org.apache.kafka.common.serialization.StringSerializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'
              deserializer:
                key:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'

            # Native Kafka deserializer + envelope: the SUT encodes,
            # the framework decodes.
            "bin-envelope-out":
              deserializer:
                key:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'

            # Record-level type is merged into every component: the value gets both
            # StringSerializer and the binary envelope.
            "bin-envelope-macro-in":
              serializer:
                type: org.apache.kafka.common.serialization.StringSerializer
                value:
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'

            # spring-json applied to the key component (KEY role, __KeyTypeId__)
            "json-spring-key-in":
              serializer:
                key:
                  type: spring-json
                  add-type-info-headers: true
                value:
                  type: spring-json
                  add-type-info-headers: true
                headers:
                  type: spring-json

            # --- MISC SCENARIOS ---

            "misc-pattern-service-orders":
              serializer:
                type: spring-json
                add-type-info-headers: true
            "misc-pattern-processed":
              deserializer:
                type: json
                target-class: io.github.dimkich.integration.testing.kafka.OrderEventDto
                headers:
                  type: string

            "misc-slow":
              serializer:
                key:
                  type: string
                value:
                  type: string
                headers:
                  type: string
            "misc-slow-result":
              deserializer:
                type: string

            "misc-cold-start":
              serializer:
                type: spring-json
                add-type-info-headers: true
            "misc-cold-start-result":
              deserializer:
                key:
                  type: string
                value:
                  type: json
                  target-class: io.github.dimkich.integration.testing.kafka.OrderDto
                headers:
                  type: string

            "misc-tx-out":
              deserializer:
                key:
                  type: string
                value:
                  type: string
                headers:
                  type: string

            "misc-tx-offsets-in":
              serializer:
                type: string
            "misc-tx-offsets-out":
              deserializer:
                type: string

            "misc-uncommitted-in":
              serializer:
                type: string
            "misc-uncommitted-out":
              deserializer:
                type: string

            "misc-assign":
              serializer:
                type: spring-json
                add-type-info-headers: true
            "misc-assign-result":
              deserializer:
                key:
                  type: string
                value:
                  type: json
                  target-class: io.github.dimkich.integration.testing.kafka.OrderEventDto
                headers:
                  type: string

            # --- XML SCENARIOS ---

            # Plain XML (type: xml - KafkaRecord serializer)
            "xml-record-in":
              serializer:
                type: xml
                headers:
                  type: string
            "xml-record-out":
              deserializer:
                type: xml
                target-class: io.github.dimkich.integration.testing.kafka.serde.json.JsonTestDto
                headers:
                  type: string

            # Spring XML (type: spring-xml - Spring Kafka native classes)


            "xml-spring-xml-in":
              serializer:
                type: spring-xml
                add-type-info-headers: true
            "xml-spring-xml-out":
              deserializer:
                type: spring-xml
                use-type-info-headers: true
                trusted-packages: "*"
            "xml-spring-xml-no-type-in":
              serializer:
                type: spring-xml
                add-type-info-headers: false
            "xml-spring-xml-no-type-out":
              deserializer:
                type: spring-xml
                use-type-info-headers: false
                target-class: io.github.dimkich.integration.testing.kafka.serde.json.JsonTestDto
                trusted-packages: "*"

        monitor:
          bootstrapServers: "${embedded.kafka.brokerList}"
          expected-groups:
            - json-record-group
          ignoreInbound: false
          excluded-fields:
            - partition
            - offset
            - timestamp
          topics:
            "bin-envelope-in":
              ignoreInbound: false
              deserializer:
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'
            "bin-envelope-out":
              ignoreInbound: false
              deserializer:
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'
            "bin-envelope-macro-in":
              ignoreInbound: false
              deserializer:
                value:
                  type: org.apache.kafka.common.serialization.StringDeserializer
                  binary-envelope: '{VER(1)}{LEN(INT, BE)}{CONTENT}'

logging:
  level:
    io.github.dimkich.integration.testing.kafka: TRACE
